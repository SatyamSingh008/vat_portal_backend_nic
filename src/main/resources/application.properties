# Server Port
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/vat_reg_db
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# 'update' will create/update the schema based on your @Entity classes on startup.
# This is perfect for development. Use 'validate' or 'none' in production.
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in the log for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Handle JSON serialization issues with lazy loading
spring.jackson.serialization.fail-on-empty-beans=false
